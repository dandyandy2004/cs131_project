<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cs131 Surveillance — Live</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>cs131 Surveillance — Live</h1>
    <div id="status" class="green">🟢 GREEN</div>
  </header>

  <main>
    <section class="latest">
      <h2>Latest event</h2>
      <img id="latest-img" alt="latest snapshot" />
      <div id="latest-meta">Waiting for first event…</div>
    </section>

    <section class="log">
      <h2>Recent events</h2>
      <table id="events">
        <thead>
          <tr>
            <th>Device</th>
            <th>Label</th>
            <th>Time</th>
            <th>Conf</th>
            <th>Identity</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <footer>
    <span id="conn-status">connecting…</span>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
